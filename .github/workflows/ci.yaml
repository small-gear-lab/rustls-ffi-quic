name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (aws-lc-rs, which Encrypted Client Hello and the QUIC test need)
        run: cargo test --locked --features aws-lc-rs
      - name: The exported functions all have the prefix of this library
        run: python3 downstream/rename-symbols.py --check
      - name: The header is what cbindgen makes of the sources
        run: |
          cargo install cbindgen --locked
          cd librustls
          cbindgen --output src/rustls.h
          git diff --exit-code src/rustls.h
